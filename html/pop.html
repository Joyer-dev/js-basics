<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    
    <button 
    onclick="
    const randomNumber = Math.random();
    let computerMove = '';

    if (randomNumber > 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
    } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'paper';
    } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'scissors';
    }
    console.log(computerMove);

    let result = '';
    if (computerMove === 'rock') {
        result = 'Tie';
    } else if (computerMove === 'paper') {
        result = 'You lose';
    } else if (computerMove === 'scissors') {
        result = 'You win';
    }

    updateScore(result);
    alert(`You picked a rock. Computer picked ${computerMove}. ${result}
    Score - Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    ">Rock</button>

    <button 
    onclick="
    const randomNumber = Math.random();
    let computerMove = '';

    if (randomNumber > 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
    } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'paper';
    } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'scissors';
    }
    console.log(computerMove);

    let result = '';
    if (computerMove === 'paper') {
        result = 'Tie';
    } else if (computerMove === 'rock') {
        result = 'You win';
    } else if (computerMove === 'scissors') {
        result = 'You lose';
    }

    updateScore(result);
    alert(`You picked paper. Computer picked ${computerMove}. ${result}
    Score - Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    ">Paper</button>

    <button
    onclick="
    const randomNumber = Math.random();
    let computerMove = '';

    if (randomNumber > 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
    } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'paper';
    } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'scissors';
    }
    console.log(computerMove);

    let result = '';
    if (computerMove === 'scissors') {
        result = 'Tie';
    } else if (computerMove === 'paper') {
        result = 'You win';
    } else if (computerMove === 'rock') {
        result = 'You lose';
    }

    updateScore(result);
    alert(`You picked scissors. Computer picked ${computerMove}. ${result}
    Score - Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    ">Scissors</button>
    

    <button 
    onclick="
    resetScore();
    alert('Scores have been reset.');
    ">Reset</button>

    <script>
        
    const score = {
        wins: 0,
        losses: 0,
        ties: 0
    };

    function updateScore(result) {
        if (result === 'You win') {
            score.wins += 1;
        } else if (result === 'You lose') {
            score.losses += 1;
        } else if (result === 'Tie') {
            score.ties += 1;
        }
        console.log(`Score - Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    }

    function resetScore() {
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        updateScore();
    }
    
    </script>
</body>
</html>
