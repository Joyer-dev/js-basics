<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>

    <button onclick="play('rock')">Rock</button>
    <button onclick="play('paper')">Paper</button>
    <button onclick="play('scissors')">Scissors</button>
    <p class="js-clas"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>
    <button onclick="resetScore(); alert('Scores have been reset.');">Reset</button>

    <script>
        const score = {
            wins: 0,
            losses: 0,
            ties: 0
        };

        function play(playerMove) {
            const randomNumber = Math.random();
            let computerMove = '';

            if (randomNumber < 1 / 3) {
                computerMove = 'rock';
            } else if (randomNumber < 2 / 3) {
                computerMove = 'paper';
            } else {
                computerMove = 'scissors';
            }
            console.log(computerMove);

            let result = '';
            if (playerMove === computerMove) {
                result = 'Tie';
            } else if (
                (playerMove === 'rock' && computerMove === 'scissors') ||
                (playerMove === 'paper' && computerMove === 'rock') ||
                (playerMove === 'scissors' && computerMove === 'paper')
            ) {
                result = 'You win';
            } else {
                result = 'You lose';
            }

            updateScore(result, playerMove, computerMove);
            alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Score - Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }

        function updateScore(result, playerMove, computerMove) {
            if (result === 'You win') {
                score.wins += 1;
            } else if (result === 'You lose') {
                score.losses += 1;
            } else if (result === 'Tie') {
                score.ties += 1;
            }
            jojo();
            document.querySelector('.js-clas').innerHTML = result;
            document.querySelector('.js-moves').innerHTML = `You picked ${playerMove} - Computer picked ${computerMove}`;
        }

        function resetScore() {
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;
            jojo();
        }

        function jojo() {
            document.querySelector('.js-score').innerHTML = `Score - Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }
    </script>
</body>
</html>
