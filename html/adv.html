<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="css/adv.css">
</head>
<body>
    <p class="game">Rock Paper Scissors</p>
    <button><img src="images/rock-emoji.png" alt="Rock" class="roc pop"></button>
    <button><img src="images/paper-emoji.png" alt="Paper" class="roc pap"></button>
    <button><img src="images/scissors-emoji.png" alt="Scissors" class="roc pup"></button>
    <p class="js-clas clas"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>
    <button class="rest" onclick="resetScore(); alert('Scores have been reset.');">Reset</button>
    <button class="auto-play" onclick="startAutoplay();">Autoplay</button>

    <script src="scripts/adv.js"></script>
</body>
</html>
